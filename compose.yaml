services:
  campusflow:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      H2_DATA_PATH: /data/campusflow
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ADMIN_PIN: ${ADMIN_PIN:?Set ADMIN_PIN in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_MOBILE: ${ADMIN_MOBILE:?Set ADMIN_MOBILE in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Campus Administrator}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - campusflow-data:/data
    restart: unless-stopped
volumes:
  campusflow-data:

spring.application.name=CampusFlow
spring.datasource.url=jdbc:h2:file:${H2_DATA_PATH:./data/campusflow};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=false
spring.sql.init.mode=always
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
app.demo=false
app.bootstrap.pin=${HOD_PIN:}
app.bootstrap.password=${HOD_PASSWORD:}
app.bootstrap.mobile=${HOD_MOBILE:}
app.bootstrap.email=${HOD_EMAIL:}
app.bootstrap.name=${HOD_NAME:Department Head}
app.bootstrap.department=${HOD_DEPARTMENT:Computer Engineering}
app.sms.sid=${TWILIO_ACCOUNT_SID:}
app.sms.token=${TWILIO_AUTH_TOKEN:}
app.sms.from=${TWILIO_FROM:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.enabled=${MAIL_ENABLED:false}
